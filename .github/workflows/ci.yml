name: CI

on:
  push:
    branches: [main, master]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  check:
    name: fmt, clippy, docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      # `--all-features` below enables `senken-app`'s `gui` feature, which
      # depends on `tauri`. Tauri v2 on Linux links WebKitGTK 4.1 (see
      # A2/N5.1) — without these packages the step fails to link, not just
      # to run. Package list per Tauri's own Linux prerequisites/CI docs
      # (verified 2026-08-30 against v2.tauri.app).
      - name: Install Tauri Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev
      # A7: `cargo check`/`clippy` must never require Node or Bun, and must
      # succeed with `packages/web/` unbuilt — this is what lets a Rust-only
      # contributor build the workspace. `packages/web/build/.gitkeep` (not
      # the built SPA) is what's committed; guard against that assumption
      # silently breaking if a built `index.html` ever gets checked in.
      - name: Assert the web app is not pre-built
        run: test ! -f packages/web/build/index.html
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --all-features
      # The types-only surface must keep building without the registry.
      # `--all-targets` on purpose: it is what a feature-matrix run does,
      # and it catches a target that forgot its `required-features`.
      - run: cargo clippy -p senken-marketdata --no-default-features --all-targets
      - run: cargo test -p senken-marketdata --no-default-features --all-targets
      # The plugin contract must build without the HTTP client too.
      - run: cargo clippy -p senken-plugin --no-default-features --all-targets
      - run: cargo doc --workspace --no-deps
        env:
          RUSTDOCFLAGS: -D warnings

  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace --all-targets
      # `--all-targets` skips doctests, so run them explicitly.
      - run: cargo test --workspace --doc

  web:
    name: web (typecheck, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
      # One lockfile at the workspace root; `--frozen-lockfile` fails rather
      # than silently resolving something new, which is what makes the
      # release build reproducible.
      - run: bun install --frozen-lockfile
      - run: bun run --filter web check
      # The release workflow embeds this output into the binary, so a broken
      # SPA build must fail here rather than at tag time.
      - run: bun run build:web

  msrv:
    name: msrv
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.97.0
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --workspace --all-targets

  deps:
    name: unused dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@cargo-machete
      - run: cargo machete
