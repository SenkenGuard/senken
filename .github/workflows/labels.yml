name: Labels

# Runs only when the label list itself changes, and on demand. `gh label
# create --force` is create-or-update, so re-running this is safe and
# idempotent.
on:
  push:
    branches: [main]
    paths:
      - .github/labels.yml
      - .github/workflows/labels.yml
  workflow_dispatch:

jobs:
  sync:
    name: apply .github/labels.yml
    runs-on: ubuntu-latest
    permissions:
      # The only permission this needs. Labels live on the issues API.
      issues: write
    steps:
      - uses: actions/checkout@v7

      # `yq` and `gh` are both present on GitHub-hosted runners, and the
      # JSON hop keeps the shell out of the business of parsing YAML.
      # Labels are never deleted here — see `.github/labels.yml`.
      - name: Sync
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          yq -o=json '.' .github/labels.yml > /tmp/labels.json
          python3 - <<'PY' > /tmp/labels.tsv
          import json, re, sys

          HEX = re.compile(r"\A[0-9a-fA-F]{6}\Z")

          for label in json.load(open("/tmp/labels.json")):
              name, colour = label["name"], label["color"]
              # An unquoted hex colour survives YAML as a number — `5319e7`
              # is a float and `008672` an integer — and would otherwise
              # fail here as an unexplained type error. Say which label.
              if not isinstance(colour, str) or not HEX.match(colour):
                  sys.exit(
                      f"label {name!r}: color must be a quoted six-digit hex "
                      f"string, got {colour!r}"
                  )
              print("\t".join([name, colour, label.get("description", "")]))
          PY
          while IFS=$'\t' read -r name color description; do
            echo "::group::$name"
            gh label create "$name" --color "$color" --description "$description" --force
            echo "::endgroup::"
          done < /tmp/labels.tsv
