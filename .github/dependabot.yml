# Dependency updates.
#
# `github-actions` is included deliberately and is the one people forget: an
# action pinned to a floating tag is code this repository runs with write
# access to its own releases, and nothing else in the tree watches it.
version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      # Matches the convention the changelog is generated from, and
      # `cliff.toml` skips `chore(deps)` so routine bumps stay out of the
      # release notes.
      prefix: "chore(deps)"

  # One lockfile at the repository root; `bun.lock` (the text format, not the
  # legacy binary `bun.lockb`) is what Dependabot reads.
  - package-ecosystem: bun
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(deps)"
