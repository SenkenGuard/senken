[package]
name = "senken-plugin-gemini"
description = "Gemini spot and perpetual market data source and Senken plugin"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
categories.workspace = true
keywords.workspace = true
repository.workspace = true
homepage.workspace = true

[lints]
workspace = true

[dependencies]
async-trait = { workspace = true }
senken-core = { workspace = true }
senken-marketdata = { workspace = true }
senken-plugin = { workspace = true, features = ["http"] }
senken-series = { workspace = true }
# The order-book port this plugin implements.
senken-subscription = { workspace = true }
senken-venue = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
# `SystemClock`: Gemini's candles carry no closed-candle flag, so this
# plugin needs a real `Clock` to close candles against — see `clock.rs`.
# `time` is the only feature it needs.
tokio = { workspace = true, features = ["time"] }

[dev-dependencies]
reqwest = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "time"] }
wiremock = { workspace = true }
