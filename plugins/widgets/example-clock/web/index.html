<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Clock</title>
<style>
  /* No framework, no build step — this is deliberately what a plugin
     author can hand-write and zip up directly. The host pushes its live
     theme into every widget's `document.documentElement` as plain CSS
     custom properties named exactly like its own (`--fg`, `--bg`, …, see
     `WIDGET-PROTOCOL.md`) — `var(--fg, …)`'s own fallback is what this
     widget renders with for the one moment before that first message
     arrives, not a value this widget invents on its own. */
  html, body {
    margin: 0;
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    background: transparent;
    font-family: var(--font-mono, ui-monospace, "SF Mono", Consolas, monospace);
    color: var(--fg, #e8e8e8);
  }
  #clock {
    font-size: 28px;
    font-weight: 600;
    letter-spacing: 0.04em;
  }
  #toggle {
    display: block;
    margin: 8px auto 0;
    font: inherit;
    font-size: 10px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    background: transparent;
    color: var(--dim, #888);
    border: 1px solid var(--dim, #888);
    border-radius: 3px;
    padding: 2px 8px;
    cursor: pointer;
  }
  main { text-align: center; }
</style>
</head>
<body>
<main>
  <div id="clock">--:--:--</div>
  <button id="toggle" type="button">12h / 24h</button>
</main>
<script>
  // --- The whole "Senken Widget Host" SDK, inlined -----------------------
  // A real SDK would ship this as a small importable module; it is written
  // out in full here, in plain vanilla JS, so this example is exactly what
  // a plugin author with no build tooling at all can copy. Every widget
  // bundle talks to the host over exactly this protocol:
  //
  //   -> { channel: 'senken.widget', v: 1, id, method, params? }
  //   <- { channel: 'senken.widget', v: 1, id, ok, result? , error? }
  //
  // `id` correlates a request with its response, the same shape any
  // JSON-RPC-flavoured protocol uses. The host only ever replies to a
  // request this exact document sent — see `plugin-widget-frame.svelte`'s
  // own doc comment on how it verifies that on its side.
  //
  // One message goes the other way with no `id` at all, because it is
  // never a request: `theme.changed`, sent whenever the host's own theme
  // does — see the `applyTheme` handler below.
  let nextId = 0;
  const pending = new Map();

  function call(method, params) {
    const id = 'w' + (nextId += 1);
    return new Promise((resolve, reject) => {
      pending.set(id, { resolve, reject });
      window.parent.postMessage({ channel: 'senken.widget', v: 1, id, method, params }, '*');
    });
  }

  function applyTheme(params) {
    if (!params || !params.tokens) return;
    const root = document.documentElement;
    for (const [name, value] of Object.entries(params.tokens)) {
      root.style.setProperty(name, value);
    }
    root.dataset.theme = params.mode;
  }

  window.addEventListener('message', (event) => {
    const data = event.data;
    if (!data || data.channel !== 'senken.widget' || data.v !== 1) return;
    if (data.method === 'theme.changed') {
      applyTheme(data.params);
      return;
    }
    const waiting = pending.get(data.id);
    if (!waiting) return;
    pending.delete(data.id);
    if (data.ok) waiting.resolve(data.result);
    else waiting.reject(new Error(data.error || 'widget host call failed'));
  });

  // --- The widget itself ---------------------------------------------
  const clockEl = document.getElementById('clock');
  const toggleEl = document.getElementById('toggle');
  let hour12 = true;

  function render() {
    clockEl.textContent = new Date().toLocaleTimeString([], { hour12 });
  }

  call('ready').then((result) => {
    const config = (result && result.config) || {};
    hour12 = config.hour12 !== false;
    render();
    setInterval(render, 1000);
  });

  toggleEl.addEventListener('click', () => {
    call('config.patch', { patch: { hour12: !hour12 } }).then((result) => {
      const config = (result && result.config) || {};
      hour12 = config.hour12 !== false;
      render();
    });
  });
</script>
</body>
</html>
