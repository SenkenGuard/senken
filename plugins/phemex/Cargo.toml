[package]
name = "senken-plugin-phemex"
description = "Phemex spot, inverse perpetual and linear perpetual market data source and Senken plugin"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
categories.workspace = true
keywords.workspace = true
repository.workspace = true
homepage.workspace = true

[lints]
workspace = true

[dependencies]
async-trait = { workspace = true }
senken-core = { workspace = true }
senken-marketdata = { workspace = true }
senken-plugin = { workspace = true, features = ["http"] }
senken-series = { workspace = true }
# The order-book port this plugin's `book` module implements (unregistered
# — see `book.rs`'s own module docs).
senken-subscription = { workspace = true }
senken-venue = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }

tokio = { workspace = true, features = ["sync"] }

[dev-dependencies]
reqwest = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
wiremock = { workspace = true }
