[package]
name = "senken-plugin-poloniex"
description = "Poloniex spot and perpetual market data source and Senken plugin"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
categories.workspace = true
keywords.workspace = true
repository.workspace = true
homepage.workspace = true

[lints]
workspace = true

[dependencies]
async-trait = { workspace = true }
senken-core = { workspace = true }
senken-marketdata = { workspace = true }
senken-plugin = { workspace = true, features = ["http"] }
senken-series = { workspace = true }
# The order-book port this plugin's `book` module implements.
senken-subscription = { workspace = true }
senken-venue = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
# `SystemClock`: candles carry no boolean closed flag — see `bars.rs`'s
# own docs on what they carry instead — so this plugin needs a real
# `Clock` to interpret it against. `time` is the only feature it needs.
tokio = { workspace = true, features = ["time"] }

[dev-dependencies]
reqwest = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "time"] }
wiremock = { workspace = true }
