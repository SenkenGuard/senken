[package]
name = "senken-plugin-okx"
description = "OKX spot market data source and Senken plugin"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
categories.workspace = true
keywords.workspace = true
repository.workspace = true
homepage.workspace = true

[lints]
workspace = true

[dependencies]
async-trait = { workspace = true }
# Parsing shared with `wasm/` (the `wasm32-wasip2` component that now
# serves this venue's spot catalog and bars) — see that crate's own
# `Cargo.toml` for why it is a plain path dependency rather than a
# `workspace.dependencies` entry.
okx-core = { path = "core" }
reqwest = { workspace = true }
senken-core = { workspace = true }
senken-marketdata = { workspace = true }
senken-plugin = { workspace = true, features = ["http"] }
senken-series = { workspace = true }
# The live-feed and order-book ports this plugin implements.
senken-subscription = { workspace = true }
senken-venue = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }

[dev-dependencies]
# Loads the built `okx-venue` component for the wasm/native equivalence
# tests (`tests/wasm_parity.rs`) — the same crate `crates/plugin-host`'s
# own `tests/venue.rs` uses for the generic fixture this one is modelled
# on.
senken-plugin-host = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "time"] }
wiremock = { workspace = true }
