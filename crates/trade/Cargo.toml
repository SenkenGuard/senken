[package]
name = "senken-trade"
description = "The Senken trade engine: the contract a broker or exchange adapter implements, the order/position/balance vocabulary it speaks, and the registry of adapters and user-attached accounts"
readme = "README.md"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
homepage.workspace = true
repository.workspace = true
categories.workspace = true
keywords.workspace = true

[features]
# The contract and its vocabulary only. An adapter crate implementing
# `TradeAdapter` needs nothing beyond this: no registry, no database, no
# identity layer.
default = []
# `TradeEngine`, the registry a runtime assembles adapters into.
engine = []
# `TradeAccountStore`: the user-attached accounts, as guarded SQLite
# queries against `senken-identity`'s own database. Pulls in `rusqlite`,
# `senken-acl` and `senken-identity`; a headless adapter author never
# compiles any of it.
accounts = ["dep:rusqlite", "dep:senken-acl", "dep:senken-identity", "dep:time"]

[dependencies]
senken-core = { workspace = true }
senken-marketdata = { workspace = true }
async-trait = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
senken-acl = { workspace = true, optional = true }
senken-identity = { workspace = true, optional = true }
rusqlite = { workspace = true, optional = true }
time = { workspace = true, optional = true }
# `TradeAccountId` is part of the contract, not just the store: an `Order`
# names the account it belongs to, so this is not optional the way the
# database dependencies are.
uuid = { workspace = true }

[dev-dependencies]
senken-acl = { workspace = true }
senken-identity = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt"] }

[lints]
workspace = true

[package.metadata.docs.rs]
all-features = true
