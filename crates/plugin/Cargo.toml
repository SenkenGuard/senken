[package]
name = "senken-plugin"
description = "The Senken plugin contract: manifest, activation context, and lifecycle hooks"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
categories.workspace = true
keywords.workspace = true
repository.workspace = true
homepage.workspace = true

[lints]
workspace = true

[features]
default = ["http"]
# The shared HTTP client, and the rate-limited `VenueClient`/`LimitGroup`
# pair built on it, on `ActivationContext`. A plugin that reads local files
# needs none of it, and this crate is only a trait contract, so the whole
# HTTP and TLS stack stays opt-out.
http = ["dep:reqwest", "dep:senken-venue"]

[dependencies]
# `BarSource` needs `TimeRange` and `Bar`/`BarSpec`; neither
# pulls networking, so both stay unconditional dependencies exactly like
# `senken-marketdata` (which `MarketDataSource` already needed the same way).
async-trait = { workspace = true }
reqwest = { workspace = true, optional = true }
# Plugin-declared permissions: `PluginNamespace` and
# `PluginPermissionName` for the manifest, `PluginPermissionRecord` for
# orphan reconciliation. Pure domain types (`serde`/`thiserror` only, see
# `senken-acl`'s own `Cargo.toml`), so — like `senken-core`/`senken-marketdata`
# below — this stays an unconditional dependency rather than living behind
# the `http` feature.
senken-acl = { workspace = true }
senken-core = { workspace = true }
senken-marketdata = { workspace = true }
senken-series = { workspace = true }
# `SystemClock::sleep_until` — the concrete `Clock` every venue adapter needs
# to tell a closed candle from a forming one.
tokio = { workspace = true, features = ["time"] }
# The live-feed ports (`FeedSource`, `VenueProtocol`, `SymbolMap`) live
# beside the pool they feed. A plugin declaring it can stream is declaring
# something about that domain, so depending on it is the honest direction —
# and `senken-subscription` knows nothing about plugins, so nothing cycles.
senken-subscription = { workspace = true }
senken-venue = { workspace = true, optional = true }
thiserror = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "time"] }
wiremock = { workspace = true }

[package.metadata.docs.rs]
all-features = true
