[package]
name = "senken-plugin"
description = "The Senken plugin contract: manifest, activation context, and lifecycle hooks"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
categories.workspace = true
keywords.workspace = true
repository.workspace = true
homepage.workspace = true

[lints]
workspace = true

[features]
default = ["http"]
# The shared HTTP client, and the rate-limited `VenueClient`/`LimitGroup`
# pair built on it, on `ActivationContext`. A plugin that reads local files
# needs none of it, and this crate is only a trait contract, so the whole
# HTTP and TLS stack stays opt-out.
http = ["dep:reqwest", "dep:senken-venue"]

[dependencies]
# `BarSource` needs `TimeRange` and `Bar`/`BarSpec`; neither
# pulls networking, so both stay unconditional dependencies exactly like
# `senken-marketdata` (which `MarketDataSource` already needed the same way).
async-trait = { workspace = true }
reqwest = { workspace = true, optional = true }
# Plugin-declared permissions: `PluginNamespace` and
# `PluginPermissionName` for the manifest, `PluginPermissionRecord` for
# orphan reconciliation. Pure domain types (`serde`/`thiserror` only, see
# `senken-acl`'s own `Cargo.toml`), so — like `senken-core`/`senken-marketdata`
# below — this stays an unconditional dependency rather than living behind
# the `http` feature.
senken-acl = { workspace = true }
senken-core = { workspace = true }
senken-marketdata = { workspace = true }
senken-series = { workspace = true }
# The `TradeAdapter` contract. Taken at its default (no features): this
# crate registers adapters, it does not run an engine or open a database,
# so neither `senken-trade`'s `engine` nor its `accounts` feature is asked
# for here — the runtime that assembles them turns `engine` on for itself.
senken-trade = { workspace = true }
senken-venue = { workspace = true, optional = true }
thiserror = { workspace = true }
# The dynamic widget UI package contract (`widget_package` module): its
# manifest is JSON, and installed packages are unpacked and tracked (enabled
# state, digest) under the data directory via `senken-storage`'s own
# atomic, path-traversal-safe writer rather than a second one reinvented
# here.
serde = { workspace = true }
serde_json = { workspace = true }
senken-storage = { workspace = true }
sha2 = { workspace = true }
zip = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "time"] }
wiremock = { workspace = true }

[package.metadata.docs.rs]
all-features = true
