[package]
name = "senken-venue"
description = "Shared plumbing for Senken venue plugins: HTTP fetch, a generic source, and decode helpers for the shapes exchange APIs actually send"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
categories.workspace = true
keywords.workspace = true
repository.workspace = true
homepage.workspace = true

[lints]
workspace = true

[dependencies]
async-trait = { workspace = true }
chrono = { workspace = true }
reqwest = { workspace = true }
# `parse_scaled`, for the one helper that has to know whether a batch of
# venue digits actually fits a scaled integer.
senken-core = { workspace = true }
senken-marketdata = { workspace = true }
serde = { workspace = true }
# `time` for the backoff between retries, `sync` for the rate/concurrency
# limiter's Semaphore; no runtime flavour is forced.
tokio = { workspace = true, features = ["sync", "time"] }
tracing = { workspace = true }

[dev-dependencies]
serde_json = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
wiremock = { workspace = true }
