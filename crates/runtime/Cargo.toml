[package]
name = "senken-runtime"
description = "The Senken runtime: assembles storage, plugins and every domain crate into one application"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
categories.workspace = true
keywords.workspace = true
repository.workspace = true
homepage.workspace = true

[lints]
workspace = true

[dependencies]
# `SeriesData`'s `CatalogBarSource` bridges `senken-loader`'s own fetch port
# onto a real `senken_plugin::BarSource`, resolving the venue-native symbol
# from the instrument catalog on every call — hence
# `senken-core` (`TimeRange`), `senken-series` (`BarSpec`, `SystemClock`'s
# `Clock` trait) and `senken-store`/`senken-loader` themselves.
async-trait = { workspace = true }
senken-acl = { workspace = true }
senken-core = { workspace = true }
senken-identity = { workspace = true }
# `UserIndicatorStore::all_compiled_for_startup` — reloading every account's
# already-compiled indicator into `user_indicators::UserIndicators` when the
# runtime starts, the same way `scan_indicator_plugin_directory` reloads
# files dropped in the data directory by hand.
senken-indicator-registry = { workspace = true }
# The ten built-in indicators' descriptor vocabulary
# (`ParamKind`/`ParamDefault`/`PlotShape`/`Drawable`/`DisplayList`) — reused
# by `plugin_host`'s dynamic-indicator bridge so an uploaded `.wasm`
# indicator's descriptor and output describe themselves in the exact same
# terms a built-in's does, rather than a second vocabulary living beside it.
senken-indicators = { workspace = true }
senken-loader = { workspace = true }
senken-marketdata = { workspace = true }
# The live-feed registrations plugins hand over; the runtime owns them and
# decides when they are connected.
senken-subscription = { workspace = true }
# A checked, non-`as` numeric conversion `plugin_host.rs` uses for the one
# WIT `scaled` value this bridge cannot losslessly type as
# `senken_indicators::ScaledPrice` — see that module's own
# `scaled_to_f64_lossy`. The same crate, same reason,
# `senken-plugin-host` already depends on it for its own f64-to-i64
# direction.
num-traits = "0.2"
# The runtime only orchestrates activation; the HTTP client is a plugin's
# business, so it does not turn that feature on.
senken-plugin = { workspace = true }
# Loads and confines compiled `.wasm` indicator components. This crate is
# the one place a Senken domain crate (`senken-series`, `senken-indicators`,
# both already required above/below for other reasons) and the plugin
# runtime are both in scope at once — `senken-plugin-api` must never depend
# on a domain crate, and `senken-plugin-host`'s own domain dependency exists
# solely to back the `builtins` WIT import — so the bridge from a real
# `senken_series::Bar` to the WIT wire shape lives here, in `plugin_host.rs`.
senken-plugin-host = { workspace = true }
senken-series = { workspace = true }
senken-storage = { workspace = true }
senken-store = { workspace = true }
# `plugin_host.rs`'s `DynamicVenues` builds one `senken_venue::LimitGroup`
# per registered venue plugin, and a shared `reqwest::Client` to hand
# `senken_plugin_host::PluginHost::load_venue` — the exact same budget and
# client shape `senken_plugin::HttpActivationContext` already builds for a
# compiled-in venue plugin, applied to the dynamically loaded path instead.
senken-venue = { workspace = true }
reqwest = { workspace = true }
serde_json = { workspace = true }
# Content-addresses a registration that never finished loading (see
# `plugin_host.rs::content_hash_id`): a component that never linked has no
# descriptor to read a real id from, so hashing its bytes gives a stable
# key for free — the same crate `senken-identity` already uses to hash
# session tokens before storing them.
sha2 = { workspace = true }
# The registry half: the runtime is where plugin-registered adapters are
# assembled into one `TradeEngine`, so it asks for that feature. `accounts`
# stays off — the attached-accounts database belongs to the HTTP layer that
# already holds an `IdentityStore`, not here.
senken-trade = { workspace = true, features = ["engine"] }
thiserror = { workspace = true }
tracing = { workspace = true }
# `plugin_host.rs`'s `DynamicVenues` runs every venue-plugin `Store` call
# through `tokio::task::spawn_blocking`: `senken_plugin_host::LoadedVenuePlugin`'s
# own methods are deliberately plain blocking calls (see that crate's own
# `http_host` module docs for why), and `MarketDataSource`/`BarSource` are
# `async fn` — `spawn_blocking` is what lets a real network fetch run
# without ever blocking whatever async executor is polling this source.
tokio = { workspace = true, features = ["rt"] }

[dev-dependencies]
tempfile = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "time"] }
# `plugin_host.rs`'s own `DynamicVenues` tests stand up a real HTTP server
# so a compiled `venue-plugin` fixture's `fetch` calls have something real
# to hit, the same technique `senken-plugin-host`'s own `tests/venue.rs`
# already uses one layer down.
wiremock = { workspace = true }
# `tests/dynamic_venue_packages.rs` packs a fixture venue component into a
# zip archive to prove `WidgetPackageStore::install` end to end, the same
# way `senken-plugin`'s own store tests do one layer down.
zip = { workspace = true }
