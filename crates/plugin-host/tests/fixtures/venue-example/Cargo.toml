# A well-behaved test fixture proving `wit/senken.wit`'s `venue-plugin`
# world end to end: fetches through the host's `http` interface (never a
# socket of its own), decodes a real recorded OKX response, and returns
# bars matching what `plugins/okx`'s own already-tested adapter expects
# from the very same bytes. Its own tiny workspace, not part of the main
# one — see `../panics/Cargo.toml` for why.
[workspace]

[package]
name = "fixture-venue-example"
version = "0.0.0"
edition = "2024"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
# The SDK a real venue plugin (`plugins/okx/wasm`, and every venue after
# it) compiles against — see `crates/plugin-api/src/lib.rs`'s
# `generated_venue` module. This fixture now exercises that module rather
# than calling `wit_bindgen::generate!` itself, so a change to how the SDK
# generates `venue-plugin` bindings is proven here before any real venue
# depends on it.
senken-plugin-api = { path = "../../../../plugin-api" }
serde_json = "1"
