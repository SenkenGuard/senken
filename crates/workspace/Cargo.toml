[package]
name = "senken-workspace"
description = "Chart workspace persistence: workspace/layout/pane/layer SQLite records with an owner, sharing senken-identity's accounts database rather than a second one"
readme = "README.md"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
homepage.workspace = true
repository.workspace = true
categories.workspace = true
keywords.workspace = true

[dependencies]
senken-acl = { workspace = true }
# Only `UnixNanos` is needed, for a trend-line/rectangle drawing's own two
# (time, price) anchors — the one time type this project uses everywhere
# (see that type's own docs for why a raw `i64` is never accepted instead).
senken-core = { workspace = true }
senken-identity = { workspace = true }
# Only `InstrumentId` is needed (a pane's/overlay layer's main instrument,
# reused rather than re-declared, the same reasoning `senken-subscription`
# documents for its own lease key). This crate would rather take it with
# `default-features = false` (the `registry` feature's async catalog
# machinery is never touched here), but a workspace member cannot override
# features on an inherited workspace dependency (already hit
# this once) — `cargo metadata` fails outright with "`default-features =
# false` cannot override workspace's `default-features`", verified by
# trying it.
senken-marketdata = { workspace = true }
senken-series = { workspace = true }
rusqlite = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
time = { workspace = true }
uuid = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }

[lints]
workspace = true
