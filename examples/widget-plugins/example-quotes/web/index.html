<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Daily Quote</title>
<style>
  html, body {
    margin: 0;
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    background: transparent;
    font-family: ui-monospace, "SF Mono", Consolas, monospace;
    color: #e8e8e8;
    padding: 8px;
    box-sizing: border-box;
  }
  main { text-align: center; max-width: 100%; }
  #quote { font-size: 13px; line-height: 1.4; }
  #fake-badge {
    display: inline-block;
    margin-top: 8px;
    font-size: 8px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: #4ade80;
    border: 1px solid #4ade80;
    border-radius: 3px;
    padding: 1px 6px;
  }
</style>
</head>
<body>
<main>
  <div id="quote">Loading…</div>
  <!--
    This badge is deliberately misleading — it is here to make a point
    demonstrable, not because a real plugin should ever do this: this
    widget's own manifest declares "dataSource": "mock", and the host
    frame draws its own, honest "Mock" label above this iframe regardless
    of what this document renders. Nothing this widget draws, claims, or
    hides can change that label, because the label is never asked of the
    widget at all — it is read straight from the validated manifest by the
    host. Open this dashboard and see both labels at once.
  -->
  <span id="fake-badge">Live feed</span>
</main>
<script>
  // Same minimal SDK as the clock example — see that plugin's own
  // `web/index.html` for the full comment explaining the protocol.
  let nextId = 0;
  const pending = new Map();
  function call(method, params) {
    const id = 'w' + (nextId += 1);
    return new Promise((resolve, reject) => {
      pending.set(id, { resolve, reject });
      window.parent.postMessage({ channel: 'senken.widget', v: 1, id, method, params }, '*');
    });
  }
  window.addEventListener('message', (event) => {
    const data = event.data;
    if (!data || data.channel !== 'senken.widget' || data.v !== 1) return;
    const waiting = pending.get(data.id);
    if (!waiting) return;
    pending.delete(data.id);
    if (data.ok) waiting.resolve(data.result);
    else waiting.reject(new Error(data.error || 'widget host call failed'));
  });

  // A fixed, seeded rotation — exactly what `dataSource: "mock"` promises:
  // a fixture, never a real feed.
  const QUOTES = [
    'Measure twice, ship once.',
    'A test that cannot fail proves nothing.',
    'The map is not the territory; the plan is not the code.',
    'Every plugin is a promise the host has to keep, not the plugin.'
  ];

  const quoteEl = document.getElementById('quote');

  function renderIndex(index) {
    quoteEl.textContent = QUOTES[((index % QUOTES.length) + QUOTES.length) % QUOTES.length];
  }

  call('ready').then((result) => {
    const config = (result && result.config) || {};
    const index = typeof config.index === 'number' ? config.index : 0;
    renderIndex(index);
  });

  quoteEl.addEventListener('click', () => {
    call('config.get').then((result) => {
      const config = (result && result.config) || {};
      const nextIndex = (typeof config.index === 'number' ? config.index : 0) + 1;
      return call('config.patch', { patch: { index: nextIndex } });
    }).then((result) => {
      const config = (result && result.config) || {};
      renderIndex(typeof config.index === 'number' ? config.index : 0);
    });
  });
</script>
</body>
</html>
